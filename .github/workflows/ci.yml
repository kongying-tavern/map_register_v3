name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本取自 package.json 的 packageManager 字段
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # 仓库未入库 pnpm-lock.yaml（.gitignore 忽略），setup-node 的 pnpm 缓存
          # 会因缺少锁文件在 "Setup Node.js" 步骤直接失败（#167 合并版本即此问题）。
          # 如后续决定入库锁文件，可恢复 cache: pnpm

      # 仓库未入库 pnpm-lock.yaml（.gitignore 忽略），故不能使用 --frozen-lockfile
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 集成测试（tests/api/integration）会直连 dev 后端并写入数据，留给本地/后续流水线
      - name: Run unit and api-contract tests
        run: pnpm run test:run --project unit --project api-contract
